name: Scheduled Deployment Health Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: [self-hosted, deploykaro]
    env:
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Check applications
        run: |
          ssh "$DEPLOY_TARGET" 'bash -s' <<'REMOTE'
          set -u

          check_app() {
            name="$1"
            host="$2"
            path="$3"

            code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 -H "Host: $host" "http:"'//127.0.0.1"$path") || code=000

            echo "$name: HTTP $code"

            if [ "$code" != "200" ]; then
              return 1
            fi
          }
          failed=0

          check_app "Bakery" "bakery.local" "/" || failed=1
          check_app "RickshawGo" "rickshaw.local" "/api/health" || failed=1
          check_app "Fees" "fees.local" "/" || failed=1
          check_app "ChaiChat" "chat.local" "/" || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "One or more application health checks failed."
            exit 1
          fi

          echo "All application health checks passed."
          REMOTE
